<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlayScore - Live Cricket Scorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* High-Performance Dark Theme */
      --primary-bg: #0B0B0B;
      --secondary-bg: #121212;
      --card-bg: #1A1A1A;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --accent-green: #00E676;
      --warning-red: #FF3B30;
      --border-color: rgba(255, 255, 255, 0.05);
      --glass-effect: rgba(255, 255, 255, 0.03);
      --shadow-primary: rgba(0, 0, 0, 0.8);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      touch-action: manipulation;
      font-size: 14pt;
    }

    .digital-timer {
      font-family: 'JetBrains Mono', monospace;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .active-scale:active {
      transform: scale(0.96);
      transition: transform 0.1s cubic-bezier(0, 0, 0.2, 1);
    }

    /* WCAG Minimum touch targets */
    button, input, [role="button"] {
      min-height: 44px;
      cursor: pointer;
    }

    .green-glow {
      box-shadow: 0 0 15px var(--accent-green);
      opacity: 0.15;
    }

    /* 3D Coin CSS */
    .coin-container {
      perspective: 1200px;
    }
    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin-flipping {
      animation: flip3D 0.6s linear infinite;
    }
    @keyframes flip3D {
      from { transform: rotateY(0deg) rotateX(15deg); }
      to { transform: rotateY(360deg) rotateX(15deg); }
    }

    .hero-score {
      font-size: 4.5rem;
      font-weight: 800;
    }
  </style>
