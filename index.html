<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BoxCricLive - Live Cricket Scorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #0B0B0B;
      --secondary-bg: #121212;
      --card-bg: #1A1A1A;
      --primary-green: #00E676;
      --secondary-green: #00C853;
      --warning-red: #FF3B30;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--primary-bg);
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      touch-action: manipulation;
    }
    .digital-timer {
      font-family: 'JetBrains Mono', monospace;
      text-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .green-glow {
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
    }
    .active-scale:active {
      transform: scale(0.96);
      transition: transform 0.1s cubic-bezier(0, 0, 0.2, 1);
    }
    /* Ensure hit targets are generous */
    button, input, [role="button"] {
      min-height: 44px;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-50 overflow-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
